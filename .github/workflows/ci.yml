name: NutritionPro CI

on:
  push:
    branches:
      - development/nutritionpro-foundation
  pull_request:
    branches:
      - development/nutritionpro-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json currently specifies npm scripts and there is no lockfile.
      # Generate the npm lockfile using the npm version bundled with Node 22.
      - name: Generate npm lockfile when missing
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # On branch pushes, preserve the generated lockfile in source control.
      # PR jobs do not push changes; they still validate using the generated lock.
      - name: Commit generated npm lockfile
        if: github.event_name == 'push' && hashFiles('package-lock.json') != ''
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm dependency lockfile"
            git push
          fi

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Run production build
        run: npm run build
